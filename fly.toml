app = 'phoenix-paper-website-falling-dawn-666'
primary_region = 'dfw'
kill_signal = 'SIGTERM'

[build]
[env]
  PHX_HOST = 'phoenix-paper-website-falling-dawn-666.fly.dev'
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 1000
    soft_limit = 1000

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
